P.forEach((t,i)=>{let b=[];const fb=()=>{if(b.length)cu.c.push({p:i+1,x:b.join(' ')});b=[]};t.split('\n').forEach(l=>{l=l.replace(/\s+/g,' ').trim();if(!l)return;if(H.test(l)){fb();secs.push(cu={n:l.slice(0,60),c:[]})}else b.push(l)});fb()});
secs=secs.filter(s=>s.c.length);

let w0='',sc=0;(x.s.match(/[A-Za-z][a-z-]{5,}/g)||[]).forEach(w=>{const l=w.toLowerCase(),v=l.length+Math.min(F[l]||0,10);if(F[l]>1&&!SW.has(l)&&x.s.indexOf(w)>0&&v>sc){sc=v;w0=w}});
if(!w0)return;const l=w0.toLowerCase(),o=pick(K,l,x.s);if(o.length<3)return;
out.push([nm,x.w<15?1:x.w<23?2:3,x.p,'Fill in the blank: '+esc(x.s.replace(new RegExp('\\b'+w0+'\\b','gi'),'_____')),esc(l),...o.map(esc),'“'+esc(x.s)+'”'])});
const st=Math.max(1,out.length/cap|0),pk=out.filter((_,i)=>i%st==0).slice(0,cap);if(!pk.length)return;
const lf={};sec.c.forEach(c=>cnt(c.x,lf));
ch.push({n:nm,s:esc(sec.ss.slice(0,2).map(x=>x.s).join(' ').slice(0,280)),o:['Key terms: '+Object.keys(lf).sort((a,b)=>lf[b]-lf[a]).slice(0,4).map(esc).join(', ')],t:[nm]});q.push(...pk)});
return{id:'c'+Date.now().toString(36),n:esc(name.replace(/\.pdf$/i,'').slice(0,40)),ch,q}}
/* Game engine */
function start(m,ch,path){let ids=Q.map((_,i)=>i);
if(m=='story'&&!path){$('#v').innerHTML=`<div class="g pad"><h1>Story Mode</h1><p>You stand at a fork inside a cell. Your choice sets the challenge.</p><button class="b s o" onclick="start('story',0,1)">Safe corridor: easier questions first</button><button class="b s o" onclick="start('story',0,2)">Risky vault: harder questions first</button></div>`;return}
if(m=='quest'){ch=ch??TC[wk()];ids=ids.filter(i=>TC[Q[i][0]]==ch)}
if(m=='weak'){ids=ids.filter(i=>S.miss[i]);if(!ids.length)return toast('No mistakes logged yet. Play a mode first, then come back.')}
shuf(ids);
if(m=='daily'){const w={};ids.forEach(i=>w[i]=isDue(i)?3:S.miss[i]?2:S.box[i]?0:1);ids.sort((a,b)=>w[b]-w[a])}
if(m=='survival')ids.sort((a,b)=>Q[a][1]-Q[b][1]);
if(m=='story')ids.sort((a,b)=>(Q[a][1]-Q[b][1])*(path==1?1:-1));
ids=ids.slice(0,m=='daily'?S.gq:M[m][3]||ids.length);
R={m,ids,i:0,ok:0,xp:0,L:m=='boss'?3:m=='survival'?1:0};R.lives=R.L;step()}
function step(){clearInterval(R.tm);const id=R.ids[R.i],q=Q[id],m=R.m,tm=m=='speed'&&!S.set.untimed;R.id=id;R.fb=0;R.op=shuf([4,5,6,7].map((x,k)=>({t:q[x],ok:!k})));
$('#v').innerHTML=`<div class="row sp"><button class="b s" onclick="go('play')">← Exit</button><span class=mu>${M[m][1]} · ${R.i+1}/${R.ids.length}${R.L?' · '+'❤️'.repeat(R.lives):''}</span></div><div class=bar style="margin:12px 0"><i style="width:${R.i/R.ids.length*100}%"></i></div>
<div class="g pad"><p class=mu>${q[0]} · ${['','Easy','Medium','Hard'][q[1]]}</p>${m=='story'?`<p class=mu><em>${ST[R.i%ST.length]}</em></p>`:''}<h2>${q[3]}</h2>${tm?'<div class=bar id=tb><i style="width:100%;transition:none"></i></div>':''}
${m=='memory'?'<button class=b id=rv onclick="rev()">Reveal answer</button>':R.op.map((o,k)=>`<button class="b s o" onclick="ans(${k})"><b>${k+1}</b> ${o.t}</button>`).join('')}<div id=fb aria-live=polite></div></div>`;
if(tm){let t=150;R.tm=setInterval(()=>{t--;const e=$('#tb i');if(e)e.style.width=t/1.5+'%';if(t<=0)ans(-1)},100)}}
const ans=k=>grade(k>=0&&!!R.op[k]&&R.op[k].ok,k);
function rev(){const q=Q[R.id];$('#rv').hidden=1;$('#fb').innerHTML=`<div class="g pad" style="margin-top:12px"><p><b>${q[4]}</b></p><p class=mu>${q[8]} (p. ${q[2]})</p><div class=row><button class=b onclick="grade(true)">Got it</button><button class="b s" onclick="grade(false)">Again</button></div></div>`}
function grade(ok,k){if(R.fb)return;R.fb=1;clearInterval(R.tm);const id=R.id,q=Q[id],b=S.box[id]||(S.box[id]={b:0,d:0}),back=ok&&S.miss[id]&&b.b<2,x=ok?10+(back?5:0):0;
if(ok){R.ok++;b.b=Math.min(4,b.b+1);if(b.b>=3)delete S.miss[id]}else{S.miss[id]=(S.miss[id]||0)+1;b.b=0;if(R.L)R.lives--}
b.d=Date.now()+[0,1,3,7,14][b.b]*864e5;S.xp+=x;R.xp+=x;S.done++;touch();snd(ok);if(back)unlock('comeback');save();
document.querySelectorAll('.o').forEach((e,i)=>{e.disabled=true;if(R.op[i].ok)e.classList.add('ok');else if(i==k)e.classList.add('no')});
const last=R.i+1>=R.ids.length||(R.L&&R.lives<=0);
$('#fb').innerHTML=`<div class="g pad ${ok?'okb':'nob'}" style="margin-top:12px"><b>${ok?'Correct'+(x?' · +'+x+' XP':''):(k===-1?'Time’s up':'Not quite')}</b><p>${ok?'':'Correct answer: <b>'+q[4]+'</b>. '}${q[8]}</p><p class=mu>Source: ${CUR.n}, p. ${q[2]}</p><button class=b id=nx onclick="nxt()">${last?'Finish':'Next'}</button></div>`;$('#nx').focus()}
function nxt(){R.i++;(R.i>=R.ids.length||(R.L&&R.lives<=0))?end():step()}
function end(){R.fb=1;const dead=R.L&&R.lives<=0;
if(R.m=='boss'&&!dead){S.xp+=20;R.xp+=20;unlock('boss')}
if(R.ok==R.ids.length&&R.ids.length>=5)unlock('flawless');if(S.xp>0)unlock('first');if(S.streak>=3)unlock('fire');if(lv()>=3)unlock('lv3');
S.log.unshift({m:M[R.m][1],s:R.ok+'/'+R.i,x:R.xp});S.log=S.log.slice(0,8);save();
$('#v').innerHTML=`<div class="g pad" style="text-align:center"><h1>${dead?'Defeated… for now':'Run complete'}</h1><p>${R.ok}/${R.i} correct · +${R.xp} XP · Level ${lv()}</p><div class=bar><i style="width:${R.ok/R.i*100}%"></i></div><p class=mu>Missed concepts return in your review queue.</p><div class=row style="justify-content:center"><button class=b onclick="go('home')">Dashboard</button><button class="b s" onclick="start('${R.m}')">Play again</button></div></div>`}
addEventListener('keydown',e=>{if(R&&R.op&&!R.fb&&R.m!='memory'&&/^[1-4]$/.test(e.key)&&R.op[+e.key-1])ans(+e.key-1)});
/* Onboarding + boot */
function pick(n,q){S.goal=n;S.gq=q;save();ob();render()}
function ob(){const e=$('#ob');if(S.goal){e.hidden=true;return}e.hidden=false;e.innerHTML=`<div class="g pad" style="max-width:460px" role=dialog aria-modal=true aria-labelledby=ot><h1 id=ot>Welcome to NEXORA</h1><p class=mu>Turn course material into missions. Learn, level up, remember. What’s your study goal?</p>${[['Exam prep',15],['Steady habit',10],['Quick catch-up',5]].map(g=>`<button class="b s o" onclick="pick('${g[0]}',${g[1]})"><b>${g[0]}</b> · ${g[1]} questions a day</button>`).join('')}</div>`;e.querySelector('button').focus()}
$('#nv').innerHTML=[['home','🏠','Home'],['lib','📚','Library'],['play','🎮','Play'],['prog','📈','Progress'],['sets','⚙️','Settings']].map(a=>`<button data-v=${a[0]} onclick="go('${a[0]}')"><span aria-hidden=true>${a[1]}</span><br>${a[2]}</button>`).join('');
ap();ob();render();
</script></body></html>
